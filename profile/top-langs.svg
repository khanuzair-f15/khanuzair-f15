
      <svg
        width="467"
        height="195"
        viewBox="0 0 467 195"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-labelledby="descId"
      >
        <title id="titleId">Most Used Languages</title>
        <desc id="descId">HTML 80.39%, Python 16.24%, CSS 2.12%, C++ 1.25%</desc>
        <style>
          .header {
            font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
            fill: #40c463;
            animation: fadeInAnimation 0.8s ease-in-out forwards;
          }
          @supports(-moz-appearance: auto) {
            /* Selector detects Firefox */
            .header { font-size: 15.5px; }
          }
          
    .stat {
      font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif; fill: #c9d1d9;
    }
    @supports(-moz-appearance: auto) {
      /* Selector detects Firefox */
      .stat { font-size:12px; }
    }
    .bold { font-weight: 700 }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    .lang-progress {
      animation: growWidthAnimation 0.8s ease-in-out forwards;
    }

    @keyframes growWidthAnimation {
      from {
        width: 0;
      }
    }
    @keyframes fadeInAnimation {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
        </style>

        <defs>
          <linearGradient id="cardGradient" x1="0" y1="0" x2="467" y2="195" gradientUnits="userSpaceOnUse">
            <stop stop-color="#0d1117" />
            <stop offset="1" stop-color="#101b16" />
          </linearGradient>
          <radialGradient id="glowGradient" cx="0" cy="0" r="1" gradientTransform="translate(430 22) rotate(136) scale(150 120)" gradientUnits="userSpaceOnUse">
            <stop stop-color="#40c463" stop-opacity=".20" />
            <stop offset="1" stop-color="#40c463" stop-opacity="0" />
          </radialGradient>
        </defs>

        <rect
          data-testid="card-bg"
          x="0.5"
          y="0.5"
          rx="12"
          height="99%"
          stroke="#30363d"
          width="466"
          fill="url(#cardGradient)"
          stroke-opacity="0.7"
        />
        <circle cx="430" cy="22" r="135" fill="url(#glowGradient)" />
        <circle cx="20" cy="195" r="80" fill="#40c463" opacity=".05" />

        <g
          data-testid="card-title"
          transform="translate(25, 35)"
        >
          <g transform="translate(0, 0)">
            <text
              x="0"
              y="0"
              class="header"
              data-testid="header"
            >Most Used Languages</text>
          </g>
        </g>

        <g
          data-testid="main-card-body"
          transform="translate(0, 55)"
        >
          <svg x="0" y="0">
            <!-- Row 1: HTML -->
            <g transform="translate(0, 0)">
              <g class="stagger" style="animation-delay: 450ms" transform="translate(25, 0)">
                <circle cx="5" cy="9" r="5" fill="#e34c26" />
                <text class="stat bold" x="22" y="13.5">HTML</text>
                <rect x="95" y="6.5" width="245" height="7" rx="3.5" fill="#21262d"/>
                <rect class="lang-progress" x="95" y="6.5" width="197" height="7" rx="3.5" fill="#e34c26"/>
                <text class="stat bold" x="417" y="13.5" text-anchor="end">80.39%</text>
              </g>
            </g>

            <!-- Row 2: Python -->
            <g transform="translate(0, 27)">
              <g class="stagger" style="animation-delay: 600ms" transform="translate(25, 0)">
                <circle cx="5" cy="9" r="5" fill="#3572A5" />
                <text class="stat bold" x="22" y="13.5">Python</text>
                <rect x="95" y="6.5" width="245" height="7" rx="3.5" fill="#21262d"/>
                <rect class="lang-progress" x="95" y="6.5" width="39.8" height="7" rx="3.5" fill="#3572A5"/>
                <text class="stat bold" x="417" y="13.5" text-anchor="end">16.24%</text>
              </g>
            </g>

            <!-- Row 3: CSS -->
            <g transform="translate(0, 54)">
              <g class="stagger" style="animation-delay: 750ms" transform="translate(25, 0)">
                <circle cx="5" cy="9" r="5" fill="#663399" />
                <text class="stat bold" x="22" y="13.5">CSS</text>
                <rect x="95" y="6.5" width="245" height="7" rx="3.5" fill="#21262d"/>
                <rect class="lang-progress" x="95" y="6.5" width="5.2" height="7" rx="3.5" fill="#663399"/>
                <text class="stat bold" x="417" y="13.5" text-anchor="end">2.12%</text>
              </g>
            </g>

            <!-- Row 4: C++ -->
            <g transform="translate(0, 81)">
              <g class="stagger" style="animation-delay: 900ms" transform="translate(25, 0)">
                <circle cx="5" cy="9" r="5" fill="#f34b7d" />
                <text class="stat bold" x="22" y="13.5">C++</text>
                <rect x="95" y="6.5" width="245" height="7" rx="3.5" fill="#21262d"/>
                <rect class="lang-progress" x="95" y="6.5" width="3.1" height="7" rx="3.5" fill="#f34b7d"/>
                <text class="stat bold" x="417" y="13.5" text-anchor="end">1.25%</text>
              </g>
            </g>
          </svg>
        </g>
      </svg>
    
