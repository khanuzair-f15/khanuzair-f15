
      <svg
        width="800"
        height="260"
        viewBox="0 0 800 260"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-labelledby="aboutTitle"
      >
        <title id="aboutTitle">About Uzair Khan</title>
        <desc>Terminal-style about card for Uzair Khan</desc>
        <style>
          @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
          }
          @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
          }
          @keyframes slideIn {
            from { opacity: 0; transform: translateX(-12px); }
            to { opacity: 1; transform: translateX(0); }
          }
          .terminal-title {
            font: 600 13px 'Fira Code', 'Cascadia Code', 'Segoe UI', monospace;
            fill: #8b949e;
          }
          .prompt {
            font: 700 14px 'Fira Code', 'Cascadia Code', monospace;
            fill: #39FF14;
          }
          .command {
            font: 400 14px 'Fira Code', 'Cascadia Code', monospace;
            fill: #c9d1d9;
          }
          .output-label {
            font: 700 14px 'Segoe UI', Ubuntu, Sans-Serif;
            fill: #40c463;
          }
          .output-text {
            font: 400 13.5px 'Segoe UI', Ubuntu, Sans-Serif;
            fill: #c9d1d9;
          }
          .output-dim {
            font: 400 13.5px 'Segoe UI', Ubuntu, Sans-Serif;
            fill: #8b949e;
          }
          .cursor {
            fill: #39FF14;
            animation: blink 1.1s step-end infinite;
          }
          .tagline {
            font: 600 16px 'Segoe UI', Ubuntu, Sans-Serif;
            fill: #58a6ff;
          }
          .tagline-sub {
            font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif;
            fill: #8b949e;
          }
          .row { animation: slideIn 0.5s ease-out backwards; }
          .row-1 { animation-delay: 0.15s; }
          .row-2 { animation-delay: 0.30s; }
          .row-3 { animation-delay: 0.45s; }
          .row-4 { animation-delay: 0.60s; }
          .dot-red { fill: #ff5f57; }
          .dot-yellow { fill: #febc2e; }
          .dot-green { fill: #28c840; }
        </style>

        <defs>
          <linearGradient id="aboutGrad" x1="0" y1="0" x2="800" y2="260" gradientUnits="userSpaceOnUse">
            <stop stop-color="#0d1117" />
            <stop offset="1" stop-color="#101b16" />
          </linearGradient>
          <radialGradient id="aboutGlow" cx="0" cy="0" r="1" gradientTransform="translate(740 30) rotate(140) scale(200 160)" gradientUnits="userSpaceOnUse">
            <stop stop-color="#40c463" stop-opacity=".15" />
            <stop offset="1" stop-color="#40c463" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="aboutGlow2" cx="0" cy="0" r="1" gradientTransform="translate(30 250) rotate(-40) scale(140 110)" gradientUnits="userSpaceOnUse">
            <stop stop-color="#39FF14" stop-opacity=".06" />
            <stop offset="1" stop-color="#39FF14" stop-opacity="0" />
          </radialGradient>
        </defs>

        <!-- Card background -->
        <rect x="0.5" y="0.5" rx="12" width="799" height="259" fill="url(#aboutGrad)" stroke="#30363d" stroke-opacity="0.7" />
        <circle cx="740" cy="30" r="160" fill="url(#aboutGlow)" />
        <circle cx="30" cy="250" r="110" fill="url(#aboutGlow2)" />

        <!-- Terminal window chrome -->
        <circle class="dot-red" cx="24" cy="20" r="5.5" />
        <circle class="dot-yellow" cx="42" cy="20" r="5.5" />
        <circle class="dot-green" cx="60" cy="20" r="5.5" />
        <text class="terminal-title" x="400" y="24" text-anchor="middle">uzair@github: ~/about</text>

        <!-- Separator line -->
        <line x1="16" y1="38" x2="784" y2="38" stroke="#21262d" stroke-width="1" />

        <!-- Command line -->
        <g transform="translate(28, 62)">
          <text class="prompt" x="0" y="0">❯</text>
          <text class="command" x="20" y="0">cat ./about.md</text>
          <rect class="cursor" x="175" y="-12" width="8" height="16" rx="1" />
        </g>

        <!-- Tagline -->
        <g transform="translate(28, 90)" class="row row-1">
          <text class="tagline" x="0" y="0">Turning curiosity into useful software.</text>
          <text class="tagline-sub" x="0" y="18">Learning with intention. Building with momentum.</text>
        </g>

        <!-- Row 1 -->
        <g transform="translate(28, 132)" class="row row-2">
          <text class="output-label" x="0" y="0">⟐  Think in systems</text>
          <text class="output-dim" x="28" y="20">Breaking down complex problems into clean, practical solutions.</text>
        </g>

        <!-- Row 2 -->
        <g transform="translate(28, 178)" class="row row-3">
          <text class="output-label" x="0" y="0">⟐  Build with purpose</text>
          <text class="output-dim" x="28" y="20">Turning ideas and lessons into projects across software, AI, and IoT.</text>
        </g>

        <!-- Row 3 -->
        <g transform="translate(28, 224)" class="row row-4">
          <text class="output-label" x="0" y="0">⟐  Grow every day</text>
          <text class="output-dim" x="28" y="20">Sharpening my DSA foundation while exploring new tools and technologies.</text>
        </g>

      </svg>
    
